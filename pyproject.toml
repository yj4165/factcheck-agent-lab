[project]
name = "factcheck-agent-lab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "faiss-cpu>=1.16.0",
    "fastmcp>=4.1.6",
    "litellm>=1.108.3",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
]
